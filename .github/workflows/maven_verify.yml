name: Java CI with Maven

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install maven if not present
        run: mvn --version 2>/dev/null || (apt-get update -q && apt-get install -y maven)

      - name: Configure Maven
        run: cp .maven-settings.xml ~/.m2/settings.xml

      - name: Build and Test
        run: mvn verify
